<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroStock | Panel Administrativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <span>Sincronizando...</span>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <nav class="navbar">
        <h1>GastroStock</h1>
        <button class="btn-whatsapp" onclick="mostrarModalProximaAct()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
            </svg>
            Notificar Gerencia
        </button>
    </nav>
    
    <div class="container">
        <div class="col-left">
            <div class="widget-dinero">
                <h3>Capital Inmovilizado</h3>
                <p class="monto" id="capital-total">S/ 0.00</p>
            </div>
            
            <div class="card">
                <div class="card-header">Gestión de Movimientos</div>
                <form id="formMovimiento">
                    <div class="form-group">
                        <label>Insumo</label>
                        <select id="id_inventario" required></select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Operación</label>
                        <select id="tipo" required>
                            <option value="entrada">Entrada (Abastecimiento)</option>
                            <option value="salida">Salida (Consumo Operativo)</option>
                            <option value="merma">Merma (Descarte)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" step="0.01" min="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Justificación</label>
                        <input type="text" id="motivo" required placeholder="Detalle de la operación">
                    </div>
                    <input type="hidden" id="usuario" value="Admin_Turno_1">
                    <button type="submit" class="btn-submit">Procesar Transacción</button>
                </form>
            </div>
        </div>
        
        <div class="col-right">
            <div class="card">
                <div class="card-header">Monitor de Inventario</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Ingrediente</th>
                                <th>Stock Actual</th>
                                <th>Estado</th>
                                <th>Valorización</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Próxima Actualización -->
    <div id="modal-update" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <div class="modal-icon">🚀</div>
            <h2>Módulo en Configuración</h2>
            <p>La integración con <strong>WhatsApp automatizado</strong> estará disponible en la próxima actualización del sistema. Gracias.</p>
            <button class="btn-submit" onclick="cerrarModal()">Entendido</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
