<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Inventario | Demo Restaurante</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; }
        .alert-badge { background-color: #dc3545; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .ok-badge { background-color: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Control de Inventario en Tiempo Real</h1>
    <p>Revisa qué insumos necesitas comprar para el turno de hoy.</p>
    
    <table>
        <thead>
            <tr>
                <th>Ingrediente</th>
                <th>Stock Actual</th>
                <th>Stock Mínimo Ideal</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="tabla-inventario">
            <!-- Los datos se inyectarán aquí con JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // URL de tu API en FastAPI
    const API_URL = 'http://127.0.0.1:8000/api/inventario';

    async function cargarInventario() {
        try {
            const respuesta = await fetch(API_URL);
            const json = await respuesta.json();
            
            const tbody = document.getElementById('tabla-inventario');
            tbody.innerHTML = ''; // Limpiar tabla

            json.data.forEach(item => {
                const tr = document.createElement('tr');
                
                // Si la cantidad es menor al mínimo, mostramos alerta visual
                const estadoHtml = item.alerta_compra 
                    ? `<span class="alert-badge">⚠️ Comprar urgente</span>` 
                    : `<span class="ok-badge">✓ Stock OK</span>`;

                tr.innerHTML = `
                    <td><strong>${item.ingrediente}</strong></td>
                    <td>${item.cantidad_actual} ${item.unidad}</td>
                    <td>${item.stock_minimo} ${item.unidad}</td>
                    <td>${estadoHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error al cargar el inventario:', error);
            document.getElementById('tabla-inventario').innerHTML = '<tr><td colspan="4">Error al conectar con la base de datos.</td></tr>';
        }
    }

    // Cargar datos al iniciar
    cargarInventario();
</script>

</body>
</html>
